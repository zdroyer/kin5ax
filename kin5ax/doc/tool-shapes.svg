<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330"
     font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The three tool shapes of a chain file: ball_end, cylinder and toroidal</title>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
    <marker id="dim2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="848" height="298" rx="6" fill="#ffffff" stroke="#d7dce3"/>
  <text x="36" y="46" font-size="15" font-weight="bold" fill="#111827">The three shapes</text>
  <text x="36" y="68" font-size="11.5" fill="#6b7280">One radius, one corner radius and the cutting height describe all three. The corner radius is what tells them apart.</text>

  <!-- ball_end -->
  <text x="150" y="98" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">ball_end</text>
  <line x1="150" y1="104" x2="150" y2="268" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="126" y="130" width="48" height="90" stroke="#b45309" fill="#fde6c8"/>
  <path d="M126 220 a24 24 0 0 0 48 0 z" stroke="#b45309" fill="#fde6c8"/>
  <circle cx="150" cy="220" r="3" fill="#1f6feb"/>
  <text x="180" y="224" font-size="10.5" fill="#1f6feb">ball_centre</text>
  <circle cx="150" cy="244" r="3" fill="#b42318"/>
  <text x="180" y="248" font-size="10.5" fill="#b42318">tip</text>
  <line x1="126" y1="118" x2="174" y2="118" stroke="#111827" stroke-width="1"
        marker-start="url(#dim2)" marker-end="url(#dim)"/>
  <text x="150" y="113" font-size="10.5" fill="#111827" text-anchor="middle">2 x radius</text>
  <text x="60" y="288" font-size="11" fill="#374151">corner radius = radius</text>

  <!-- cylinder -->
  <text x="440" y="98" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">cylinder</text>
  <line x1="440" y1="104" x2="440" y2="268" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="416" y="130" width="48" height="114" stroke="#b45309" fill="#fde6c8"/>
  <circle cx="440" cy="244" r="3" fill="#b42318"/>
  <text x="470" y="248" font-size="10.5" fill="#b42318">tip</text>
  <line x1="416" y1="118" x2="464" y2="118" stroke="#111827" stroke-width="1"
        marker-start="url(#dim2)" marker-end="url(#dim)"/>
  <text x="440" y="113" font-size="10.5" fill="#111827" text-anchor="middle">2 x radius</text>
  <line x1="396" y1="130" x2="396" y2="244" stroke="#111827" stroke-width="1"
        marker-start="url(#dim2)" marker-end="url(#dim)"/>
  <text x="388" y="190" font-size="10.5" fill="#111827" text-anchor="end">cutting height</text>
  <text x="358" y="288" font-size="11" fill="#374151">corner radius = 0 (a flat end mill)</text>

  <!-- toroidal -->
  <text x="716" y="98" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">toroidal</text>
  <line x1="716" y1="104" x2="716" y2="268" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M692 130 L740 130 L740 232 a12 12 0 0 1 -12 12 L704 244 a12 12 0 0 1 -12 -12 z"
        stroke="#b45309" fill="#fde6c8"/>
  <path d="M728 232 a12 12 0 0 0 12 -12" stroke="#1f6feb" stroke-width="1.6" fill="none"/>
  <circle cx="728" cy="232" r="2.5" fill="#1f6feb"/>
  <text x="748" y="226" font-size="10.5" fill="#1f6feb">corner radius</text>
  <circle cx="716" cy="244" r="3" fill="#b42318"/>
  <text x="748" y="258" font-size="10.5" fill="#b42318">tip</text>
  <line x1="692" y1="118" x2="740" y2="118" stroke="#111827" stroke-width="1"
        marker-start="url(#dim2)" marker-end="url(#dim)"/>
  <text x="716" y="113" font-size="10.5" fill="#111827" text-anchor="middle">2 x radius</text>
  <text x="620" y="288" font-size="11" fill="#374151">0 &lt; corner radius &lt; radius (a bull nose)</text>

  <text x="36" y="308" font-size="11" fill="#6b7280">The programmed point is the tip unless the file says otherwise; ball_centre is for a ball nose tool, custom is a height above the tip.</text>
</svg>
