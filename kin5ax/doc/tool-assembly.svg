<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <title>The tool assembly: the nose of the spindle, the holder, the tool and the three lengths</title>
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111827"/>
    </marker>
    <marker id="dim2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#111827"/>
    </marker>
    <marker id="tb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="848" height="438" rx="6" fill="#ffffff" stroke="#d7dce3"/>
  <text x="36" y="46" font-size="15" font-weight="bold" fill="#111827">The tool assembly</text>
  <text x="36" y="68" font-size="11.5" fill="#6b7280">A holder with the tool installed in it, measured from the nose of the tool spindle. Only the offset reaches the solver.</text>

  <!-- the axis of the spindle -->
  <line x1="200" y1="92" x2="200" y2="430" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- the nose: the terminal of the tool branch -->
  <line x1="92" y1="120" x2="332" y2="120" stroke="#111827" stroke-width="2"/>
  <text x="92" y="112" font-size="12" font-weight="bold" fill="#1f6feb">tool_spindle_nose</text>
  <g stroke="#1f6feb" stroke-width="1.5" fill="none">
    <line x1="296" y1="120" x2="296" y2="96" marker-end="url(#tb)"/>
    <line x1="296" y1="120" x2="322" y2="120" marker-end="url(#tb)"/>
  </g>
  <circle cx="296" cy="120" r="3" fill="#1f6feb"/>
  <text x="301" y="93" font-size="10.5" fill="#1f6feb">Z</text>
  <text x="324" y="133" font-size="10.5" fill="#1f6feb">X</text>

  <!-- the holder: up to three cylinders, from the nose downwards -->
  <g stroke="#6b7280" fill="#e5e7eb">
    <rect x="156" y="120" width="88" height="50"/>
    <rect x="173" y="170" width="54" height="26"/>
    <rect x="175" y="196" width="50" height="40"/>
  </g>
  <text x="252" y="150" font-size="11.5" fill="#374151">section 1: the taper and the flange</text>
  <text x="252" y="188" font-size="11.5" fill="#374151">section 2: what it narrows to</text>
  <text x="252" y="222" font-size="11.5" fill="#374151">section 3: the nose of the holder</text>

  <!-- the tool sticking out of it -->
  <rect x="191" y="236" width="18" height="68" stroke="#6b7280" fill="#f3f4f6"/>
  <text x="252" y="274" font-size="11.5" fill="#374151">the shank: length less the cutting height</text>
  <rect x="188" y="304" width="24" height="46" stroke="#b45309" fill="#fde6c8"/>
  <path d="M188 350 a12 12 0 0 0 24 0 z" stroke="#b45309" fill="#fde6c8"/>
  <text x="252" y="330" font-size="11.5" fill="#b45309">the cutting part</text>

  <!-- the three places a cutter location may be programmed at -->
  <circle cx="200" cy="362" r="3.5" fill="#b42318"/>
  <text x="222" y="382" font-size="11.5" fill="#b42318">tip</text>
  <circle cx="200" cy="350" r="3.5" fill="#1f6feb"/>
  <text x="222" y="353" font-size="11.5" fill="#1f6feb">ball_centre</text>
  <circle cx="200" cy="318" r="3.5" fill="#6b7280"/>
  <text x="222" y="308" font-size="11.5" fill="#6b7280">custom: a height above the tip</text>

  <!-- the three lengths -->
  <line x1="136" y1="120" x2="136" y2="236" stroke="#111827" stroke-width="1"
        marker-start="url(#dim2)" marker-end="url(#dim)"/>
  <text x="128" y="182" font-size="11" fill="#111827" text-anchor="end">holder</text>
  <line x1="104" y1="120" x2="104" y2="362" stroke="#111827" stroke-width="1.2"
        marker-start="url(#dim2)" marker-end="url(#dim)"/>
  <text x="96" y="244" font-size="11" fill="#111827" text-anchor="middle"
        transform="rotate(-90 96 244)">assembly length</text>
  <line x1="68" y1="120" x2="68" y2="350" stroke="#b42318" stroke-width="1.6"
        marker-start="url(#dim2)" marker-end="url(#dim)"/>
  <text x="58" y="238" font-size="12" font-weight="bold" fill="#b42318" text-anchor="middle"
        transform="rotate(-90 58 238)">tool offset</text>

  <text x="40" y="420" font-size="11.5" fill="#6b7280">The assembly adds up: the holder, then what sticks out of it. A tool pulled further out of its collet is a longer offset and nothing else.</text>

  <line x1="470" y1="92" x2="470" y2="430" stroke="#e5e7eb"/>

  <!-- what each of them is for -->
  <rect x="496" y="96" width="348" height="92" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="512" y="118" font-size="12.5" font-weight="bold" fill="#111827">where the nose is</text>
  <text x="512" y="138" font-size="11.5" fill="#374151">On the spindle axis, where the axis meets the envelope of</text>
  <text x="512" y="154" font-size="11.5" fill="#374151">the spindle: the centre of the taper entrance. OZ runs</text>
  <text x="512" y="170" font-size="11.5" fill="#374151">along the axis, away from the work.</text>

  <rect x="496" y="202" width="348" height="108" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="512" y="224" font-size="12.5" font-weight="bold" fill="#b42318">the offset is said, never guessed</text>
  <text x="512" y="244" font-size="11.5" fill="#374151">It is the whole of what the five axes know about the tool.</text>
  <text x="512" y="260" font-size="11.5" fill="#374151">A chain that was not told it refuses to solve. Zero is the</text>
  <text x="512" y="276" font-size="11.5" fill="#374151">nose itself and is said as plainly as any other number; a</text>
  <text x="512" y="292" font-size="11.5" fill="#374151">negative one would end the tool inside the spindle.</text>

  <rect x="496" y="324" width="348" height="92" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="512" y="346" font-size="12.5" font-weight="bold" fill="#111827">nothing in the spindle</text>
  <text x="512" y="366" font-size="11.5" fill="#374151">NO_HOLDER with NO_TOOL: no solid and no length, and a</text>
  <text x="512" y="382" font-size="11.5" fill="#374151">postprocessor takes it like any other assembly. The</text>
  <text x="512" y="398" font-size="11.5" fill="#374151">collision check then says it has no tool to test.</text>
</svg>
